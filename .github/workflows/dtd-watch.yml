name: dtd-watch
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: dtd-watch
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 watch/watch.py
      - run: |
          git config user.name "dtd-watch"
          git config user.email "dtd-watch@users.noreply.github.com"
          git add watch/status.json
          git diff --cached --quiet || git commit -m "watch: $(date -u +%FT%RZ)"
          git push
