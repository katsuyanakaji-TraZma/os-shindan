const LANDMARKS = [{"km": 0, "short": "名城公園", "name": "名城公園（スタート）", "story": "名古屋城の北側に広がる公園で、もとは城の北側を守る湿地帯「御深井（おふけ）」でした。戦後に整備され、いまは市民のランニングコースとしておなじみの場所です。", "tip": "受付のある「郷土の森」は、園内でも木々が多い一角。スタート前に見える天守の屋根の金鯱が、ゴールまで続く「家康の道」の始まりの合図です。"}, {"km": 0.8, "short": "名古屋城", "name": "名古屋城", "story": "1610年、徳川家康が九男・義直のために築かせた城。西国の大名たちに費用と人手を出させる「天下普請」で建てられ、石垣には加藤清正が運んだとされる「清正石」が残ります。", "tip": "本丸御殿は戦災で焼けましたが、残された実測図や写真をもとに木造で復元され、2018年に全公開されました。天守の金鯱は空襲で溶け、戦後に作り直されたもの。初代の金は小判に換算すると莫大だったと言われています。"}, {"km": 3.3, "short": "徳川園", "name": "徳川園", "story": "尾張藩2代藩主・徳川光友が1695年に隠居所として造った大曽根屋敷が始まり。池を中心に歩いて楽しむ「池泉回遊式」の日本庭園で、隣には徳川美術館があります。", "tip": "徳川美術館には国宝「源氏物語絵巻」が収められています。尾張徳川家は御三家の筆頭で、名古屋城とこの屋敷を行き来した殿様が、いま歩いているこの道を籠で通ったかもしれません。"}, {"km": 9.5, "short": "給水ポイント", "name": "給水ポイント（ファミマ昭和滝川町店）", "story": "最初の給水ポイント。設営は16:00〜18:30。ここまで約9.5km、名古屋の市街地を抜けて八事の坂にさしかかる手前です。", "tip": "日没は17時前。ここで反射板とヘッドランプを出しておくと、次のエイドまでの夜道が楽です。"}, {"km": 10.4, "short": "八事山興正寺", "name": "八事山興正寺", "story": "1686年に開かれた真言宗の寺で、尾張徳川家の祈願所として庇護を受けました。境内の五重塔は1808年の建立で、愛知県に残る唯一の木造五重塔。国の重要文化財です。", "tip": "八事（やごと）は名古屋の東の高台。ここから先は「尾張」から「三河」へ向かう緩やかな上りが始まります。暗くなる時間帯なので、塔のシルエットが見えたら夜の部の始まりです。"}, {"km": 20, "short": "日進", "name": "天白川〜日進", "story": "名古屋市天白区から日進市へ。この一帯は戦国時代、織田と今川がにらみ合った最前線でした。桶狭間はここから南へ10kmほど。1560年、家康はまだ今川方の武将としてその戦いに加わっていました。", "tip": "日進市には「岩崎城」という小さな城跡があります。小牧・長久手の戦いの時、ここを守った城兵がほぼ全滅した悲劇の城。夜道の静けさの中に、そんな歴史が眠っています。"}, {"km": 25, "short": "第1エイド", "name": "第1エイド（セブンイレブン みよし打越新池浦店）", "story": "最初の本格エイド。設営は18:30〜22:30。日進を抜け、みよし市に入ったところ。ここから豊田市街まであと5kmほど。", "tip": "みよし市は「三好」から2010年にひらがなの市名になった町。ここを過ぎると街の灯りが減り、空気が冷え始めます。上着を一枚。"}, {"km": 30.2, "short": "豊田市街", "name": "豊田市街（挙母）", "story": "豊田市は1959年まで「挙母（ころも）」という名でした。江戸時代は挙母藩2万石の城下町。トヨタ自動車の本社が置かれたことで、会社名にちなんで市名を変えた、全国でも珍しい街です。", "tip": "挙母神社の秋祭りは山車が8台出る三河有数の祭り。もし街中でトヨタのロゴを見かけたら、創業者・豊田喜一郎の父は、織機を発明した豊田佐吉。「自働織機」の思想がいまのトヨタ生産方式につながったと言われています。"}, {"km": 44, "short": "松平東照宮", "name": "松平東照宮（第2エイド・44km）", "story": "ここ松平郷は徳川将軍家のルーツ、松平氏の発祥の地。室町時代、旅の僧だった松平親氏がこの地に入り、松平家の初代となりました。東照宮は家康と親氏を祀り、境内には親氏が家康の産湯に使ったと伝わる「産湯の井戸」があります。", "tip": "大会参加者だけの特典で、夜間に拝殿の格天井画を見られます。108枚の花鳥画は2015年に地元の画家が奉納したもの。すぐ隣の高月院は松平家の菩提寺で、家康の先祖の墓が並びます。深夜のここが「家康の道」のいちばん濃い場所です。"}, {"km": 57, "short": "滝山寺", "name": "滝山寺（第3エイド・57km）", "story": "奈良時代の創建と伝わる天台宗の古刹。源頼朝の従兄弟が住職だった縁で頼朝の菩提を弔う寺となり、運慶・湛慶作とされる聖観音・梵天・帝釈天の三体が重要文化財として残ります。", "tip": "境内の滝山東照宮は、日光・久能山と並ぶ「日本三大東照宮」の一つに数えられることがあります。2月の「鬼まつり」は火を振り回す勇壮な祭りで有名。夜明け前の冷え込みが最も強い時間帯。ここで温かいものを。"}, {"km": 61.8, "short": "大樹寺", "name": "大樹寺", "story": "松平家・徳川将軍家の菩提寺。1560年、桶狭間で今川義元が討たれた直後、19歳の家康はこの寺に逃げ込み、先祖の墓前で自害しようとしました。住職に諭されて思いとどまった、家康の人生の転換点です。", "tip": "その時に授けられた言葉が「厭離穢土 欣求浄土（おんりえど ごんぐじょうど）」。家康は生涯この旗印を使いました。山門から岡崎城の天守がまっすぐ見通せる「ビスタライン」は約3km。歴代藩主が守り続け、いまも高い建物を建てない約束が生きています。"}, {"km": 65.1, "short": "岡崎城", "name": "岡崎城", "story": "1542年、徳川家康がここで生まれました。幼名は竹千代。6歳で人質に出され、19歳でこの城に戻るまで故郷を離れていました。別名「龍城（りゅうじょう）」。乙川と矢作川が合流する水運の要の地です。", "tip": "城のすぐ西、八丁（約870m）離れた八帖町が「八丁味噌」の発祥。カクキューとまるやの二軒が江戸時代から同じ製法を守っています。家康が生まれた産湯の井戸、えな塚（へその緒を埋めた塚）も公園内に。"}, {"km": 74, "short": "藤川宿", "name": "道の駅 藤川宿（第4エイド・関門11:30）", "story": "藤川宿は東海道五十三次の37番目の宿場。岡崎宿と赤坂宿の間にあり、いまも松並木と古い町並みが残ります。ここから先は旧東海道を歩く区間。第4エイドは道の駅で折り返し、藤川駅前の道へ進みます。設営は翌3:00〜11:30、関門は11:30。", "tip": "藤川の名物は「むらさき麦」。穂が紫色に色づく珍しい麦で、芭蕉が「ここも三河 むらさき麦の かきつばた」と詠んだと伝わります。朝の光でこの先の松並木が見え始める時間帯です。"}, {"km": 84.2, "short": "赤坂宿", "name": "本宿〜赤坂宿", "story": "本宿は家康ゆかりの法蔵寺がある集落。赤坂宿は東海道36番目の宿場で、江戸時代は旅籠が80軒以上並ぶにぎやかな宿場でした。旅籠「大橋屋」の建物が今も残り、見学できます。", "tip": "赤坂と御油は宿場の間がわずか1.7kmで、東海道で最も近い隣同士。両宿の客引きが激しかった話は十返舎一九の「東海道中膝栗毛」にも描かれています。弥次さん喜多さんも歩いた道です。"}, {"km": 85.5, "short": "御油松並木", "name": "御油の松並木", "story": "御油宿と赤坂宿の間に約600mにわたって残る松並木。江戸時代初期に植えられ、国の天然記念物に指定されています。約300本の松が、旧東海道の面影をいちばん濃く残す場所です。", "tip": "松並木は夏は日陰、冬は風よけとして旅人を守るために植えられました。400年前の旅人と同じ木陰を歩いていることになります。ここを抜ければ豊橋まであと15km。"}, {"km": 88, "short": "第5エイド", "name": "第5エイド（ローソン豊川国府店・関門）", "story": "最後のエイド。設営は翌5:00〜16:00、関門は16:00。国府（こう）は三河国の国府が置かれた土地で、国分寺跡や三河総社が近くにあります。", "tip": "ゴールまで残り約11km。豊川を渡れば豊橋市。ここで最後の補給を済ませて、吉田城まで一気に。"}, {"km": 93, "short": "豊川", "name": "豊川〜下地", "story": "豊川（とよがわ）を渡って豊橋市へ。江戸時代、ここには東海道の「吉田大橋」がかかり、川の向こうの吉田宿は三河国の中心でした。下地（しもじ）は橋の手前の集落です。", "tip": "豊橋の旧名は「吉田」。明治になって「豊橋」に改められました。豊川稲荷で知られる豊川市とは別の川沿いの街。橋を渡れば、最後の見どころ吉田城はもうすぐ。"}, {"km": 97.4, "short": "吉田城", "name": "吉田城", "story": "今川、徳川、そして1590年に池田輝政が入って大改修した城。輝政はのちに姫路城を築いた人物で、ここは豊川に面した背水の城。石垣の一部は輝政時代のものが残っています。", "tip": "鉄櫓（くろがねやぐら）は1954年に復元されたもの。豊橋公園の中にあり、ゴールの豊橋別院まではあとわずか。公園の中で吉田城の石垣を見上げたら、100kmの旅はもう終わりです。"}, {"km": 98.8, "short": "花園幼稚園", "name": "花園幼稚園（ゴール）", "story": "ゴールは豊橋別院の境内にある幼稚園。豊橋別院は東本願寺（真宗大谷派）の三河別院で、豊橋の中心市街地に建っています。家康が生まれた岡崎から、家康ゆかりの吉田を経て、ここが終点です。", "tip": "豊橋銘菓「ブラックサンダーあん巻き」は、ブラックサンダーの有楽製菓の工場が豊橋にあることから生まれました。スタートで注文した人はここで受け取り。ゴールの一歩は、ゆっくり踏んでください。"}];
const AIDS=[{km:9.5,n:'給水'},{km:25,n:'A1'},{km:44,n:'A2 松平郷'},{km:57,n:'A3 滝山寺'},{km:74,n:'A4 藤川宿 関門11:30'},{km:88,n:'A5 国府 関門16:00'},{km:98.8,n:'GOAL'}];
const COLORS=['#c0392b','#2471a3','#1e8449','#8e44ad','#d68910','#117a65','#a04000','#2e4053','#b03a2e','#1f618d','#196f3d','#6c3483'];
const map=L.map('map',{zoomControl:true}).setView([34.97,137.15],10);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
const line=L.polyline(TRACK.map(p=>[p[0],p[1]]),{color:'#c0392b',weight:4,opacity:.8}).addTo(map);
function atKm(km){ let b=TRACK[0]; for(const p of TRACK){ if(Math.abs(p[2]-km)<Math.abs(b[2]-km)) b=p; } return [b[0],b[1]]; }
AIDS.forEach(a=>{ L.marker(atKm(a.km),{icon:L.divIcon({className:'',html:`<div class="aid">${a.km}km ${a.n}</div>`,iconAnchor:[0,10]})}).addTo(map); });
const markers={}, colorOf={}; let ci=0;
function pad(n){return String(n).padStart(2,'0')}
function ago(ms){ const m=Math.round(ms/60000); return m<1?'たった今':m<60?m+'分前':Math.floor(m/60)+'時間'+(m%60)+'分前'; }
function placeName(km){ let b=LANDMARKS[0]; for(const l of LANDMARKS){ if(Math.abs(l.km-km)<Math.abs(b.km-km)) b=l; } return b.short; }
function nextAid(km){ return AIDS.find(a=>a.km>km); }
async function load(){
  try{ const r=await fetch(NTFY+'/json?poll=1&since=6h&_='+Date.now()); if(!r.ok) throw 0; const txt=await r.text(); const latest={};
    txt.split('\n').forEach(line=>{ if(!line.trim()) return; try{ const ev=JSON.parse(line); if(ev.event!=='message') return; const d=JSON.parse(ev.message); if(!d.name) return; d.ts=d.t||ev.time*1000; if(!latest[d.name]||latest[d.name].ts<d.ts) latest[d.name]=d; }catch(e){} });
    const people=Object.values(latest).filter(d=>!d.off); render({now:Date.now(),people}); document.getElementById('st').textContent='更新 '+new Date().toTimeString().slice(0,5)+' ・ '+people.length+'人'; }
  catch(e){ document.getElementById('st').textContent='取得できず（1分後に再試行）'; } }
function render(j){ const people=(j.people||[]).filter(p=>p.lat&&p.lon).sort((a,b)=>(b.km||0)-(a.km||0)); const list=document.getElementById('list'); list.innerHTML='';
  if(!people.length){ list.innerHTML='<div class="empty">まだ誰も共有していません。旅の友の下のほうで名前を入れて「共有」をONに。</div>'; return; }
  const now=j.now||Date.now();
  people.forEach((p,i)=>{ if(!colorOf[p.name]) colorOf[p.name]=COLORS[(ci++)%COLORS.length]; const c=colorOf[p.name]; const stale=now-p.ts>20*60000; const ini=String(p.name).slice(0,2);
    const html=`<div class="pin" style="background:${c};width:26px;height:26px;opacity:${stale?.5:1}">${ini}</div>`;
    const icon=L.divIcon({className:'',html,iconSize:[26,26],iconAnchor:[13,13]});
    const na=nextAid(p.km||0); const pop=`<b>${p.name}</b><br>${(p.km||0).toFixed(1)}km ・ ${placeName(p.km||0)}付近<br>${na?'次: '+na.n+' あと'+(na.km-p.km).toFixed(1)+'km':'ゴール'}<br>${p.pace}hペース ・ ${ago(now-p.ts)}${p.note?'<br>📝 '+p.note:''}`;
    if(markers[p.name]){ markers[p.name].setLatLng([p.lat,p.lon]).setIcon(icon).bindPopup(pop); } else { markers[p.name]=L.marker([p.lat,p.lon],{icon}).addTo(map).bindPopup(pop); }
    const row=document.createElement('div'); row.className='row'+(stale?' stale':''); row.innerHTML=`<div class="dot" style="background:${c}">${ini}</div><div><div class="nm">${p.name}</div><div class="sub">${placeName(p.km||0)}付近 ・ ${na?'次 '+na.n+' あと'+(na.km-p.km).toFixed(1)+'km':'ゴール'}${p.note?' ・ 📝'+p.note:''}</div></div><div><div class="km">${(p.km||0).toFixed(1)}<span style="font-size:12px;color:var(--mute)">km</span></div><div class="ago">${ago(now-p.ts)}</div></div>`;
    row.onclick=()=>{ map.setView([p.lat,p.lon],14); markers[p.name].openPopup(); }; list.appendChild(row); });
  for(const n in markers){ if(!people.find(p=>p.name===n)){ map.removeLayer(markers[n]); delete markers[n]; } } }
document.getElementById('fit').onclick=()=>{ const ms=Object.values(markers); if(ms.length) map.fitBounds(L.featureGroup(ms).getBounds().pad(.3)); else map.fitBounds(line.getBounds()); };
map.fitBounds(line.getBounds());
load(); setInterval(load,60000);
</script></body></html>
